name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: pages-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to geop-cad.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: 9f1c6a47335dac47c8e580e269b0ae8d
          command: pages deploy docs --project-name=geop-cad-landing --branch=main
