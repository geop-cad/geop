name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "homepage/**"
      - "cad/geop-cad-cli/**"
      - "ops/geop-ops-parts/src/examples.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: pages-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The examples carousel's STL previews (see homepage/index.html) —
      # generated fresh each deploy, not committed.
      - name: Export example STLs
        run: cargo run -p geop-cad-cli --release -- examples --out-dir homepage/examples

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: 9f1c6a47335dac47c8e580e269b0ae8d
          command: pages project create geop-cad-landing --production-branch main

      - name: Deploy to geop-cad.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: 9f1c6a47335dac47c8e580e269b0ae8d
          command: pages deploy homepage --project-name=geop-cad-landing --branch=main --commit-dirty=true
