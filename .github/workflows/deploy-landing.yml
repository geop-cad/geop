name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "homepage/**"
      - "cad/geop-cad-cli/**"
      - "ops/geop-ops-parts/src/examples.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: pages-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The STL previews (see homepage/index.html) — generated fresh each
      # deploy, not committed. Only the examples the page actually shows:
      # the carousel's data-example attributes, plus the agent demo's
      # bracket.
      - name: Export example STLs
        run: |
          cargo run -p geop-cad-cli --release -- examples --out-dir homepage/examples \
            --only cross_drilled_shaft \
            --only handle_with_hole \
            --only luggage_tag \
            --only bracket

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: 9f1c6a47335dac47c8e580e269b0ae8d
          command: pages project create geop-cad-landing --production-branch main

      # Run from homepage/ so Wrangler finds homepage/functions/ (Pages
      # Functions are discovered relative to the working directory, not the
      # deployed directory) and picks up its bindings — see
      # functions/api/contact.ts.
      - name: Deploy to geop-cad.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: 9f1c6a47335dac47c8e580e269b0ae8d
          workingDirectory: homepage
          command: pages deploy . --project-name=geop-cad-landing --branch=main --commit-dirty=true
