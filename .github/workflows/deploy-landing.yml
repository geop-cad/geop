name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "homepage/**"
      - "cad/geop-cad-cli/**"
      - "cad/geop-cad-base/src/examples.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: pages-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The STL previews (see homepage/index.html) — generated fresh each
      # deploy, not committed. Only the examples the page actually shows:
      # the carousel's data-example attributes, plus the agent demo's
      # bracket.
      - name: Export example STLs
        run: |
          cargo run -p geop-cad-cli --release -- examples --out-dir homepage/examples \
            --only turbine_blade \
            --only cool_flange \
            --only press \
            --only edge_part \
            --only bracket

      # three.js is served from the site itself rather than a CDN, so a
      # visitor's IP address never reaches a third party (see
      # homepage/privacy.html). Fetched fresh each deploy, like the STLs;
      # keep the version in step with web/package.json.
      - name: Vendor three.js
        run: |
          mkdir -p homepage/vendor
          npm pack three@0.185.1 --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/three-0.185.1.tgz -C "$RUNNER_TEMP"
          mkdir -p homepage/vendor/three/build homepage/vendor/three/examples/jsm/loaders
          cp "$RUNNER_TEMP"/package/build/three.module.min.js "$RUNNER_TEMP"/package/build/three.core.min.js homepage/vendor/three/build/
          cp "$RUNNER_TEMP"/package/examples/jsm/loaders/STLLoader.js homepage/vendor/three/examples/jsm/loaders/

      # PostHog's browser bundle, served from the site itself like three.js,
      # and the project key substituted into analytics.js. Without the
      # variable the placeholder stays and the page sends nothing. Keep the
      # version in step with web/package-lock.json.
      - name: Vendor PostHog and set its key
        env:
          POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
        run: |
          npm pack posthog-js@1.434.15 --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP"/posthog homepage/vendor/posthog
          tar -xzf "$RUNNER_TEMP"/posthog-js-1.434.15.tgz -C "$RUNNER_TEMP"/posthog
          cp "$RUNNER_TEMP"/posthog/package/dist/array.no-external.js homepage/vendor/posthog/
          if [ -n "$POSTHOG_KEY" ]; then
            sed -i "s/__POSTHOG_KEY__/$(printf '%s' "$POSTHOG_KEY" | tr -d '[:space:]')/" homepage/analytics.js
          fi

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: 9f1c6a47335dac47c8e580e269b0ae8d
          command: pages project create geop-cad-landing --production-branch main

      # Run from homepage/ so Wrangler finds homepage/functions/ (Pages
      # Functions are discovered relative to the working directory, not the
      # deployed directory) and picks up its bindings — see
      # functions/api/contact.ts.
      - name: Deploy to geop-cad.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: 9f1c6a47335dac47c8e580e269b0ae8d
          workingDirectory: homepage
          command: pages deploy . --project-name=geop-cad-landing --branch=main --commit-dirty=true
