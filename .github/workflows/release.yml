name: Release

# A tag `v*` (made by scripts/release.sh) builds the `geop` command line
# tool for every platform, with the page `geop open` serves built in, the
# VS Code extension for every platform (each with that platform's `geop`
# in it), and the web app's static build, and publishes them as a GitHub
# release with their SHA-256 sums — which `homepage/install.sh` and
# `geop vscode` check every download against. It also packages the program a
# person double-clicks for each desktop (`scripts/package-desktop.sh`,
# docs/desktop.md), and starts each on a machine of its kind before anything
# is published. Started by hand, it does only that: a rehearsal, which
# publishes nothing. Nothing here is capped: a runner is its own machine.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The pages whose kernel is a native `geop`: the one `geop open` serves
  # (built into the CLI), and the VS Code extension's. Built once, for
  # every platform; neither needs the wasm module.
  pages:
    name: Pages for the native kernel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build:open
          npm run build:vscode

      - uses: actions/upload-artifact@v4
        with:
          name: page-open
          path: web/dist-open
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: page-vscode
          path: vscode-extension/media
          if-no-files-found: error

  # The program a person double-clicks. Started on the machine it is for,
  # with no folder and a home of its own, as someone who has just downloaded
  # it would: it has to stay up, and make the folder it opens. What it shows
  # is kept with the run, since a test of its server sees none of it.
  desktop:
    name: Desktop (${{ matrix.target }})
    needs: [pages]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # As old as the WebKitGTK 4.1 it links is: what it then runs on.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: page-open
          path: web/dist-open

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install WebKitGTK
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb imagemagick

      - name: Build
        shell: bash
        run: cargo build --release --locked -p geop-cad-cli --features frontend,app,desktop --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # A rehearsal has no version.
          case "$version" in [0-9]*) ;; *) version=0.0.0 ;; esac
          case "${{ matrix.target }}" in
            *windows*) binary="target/${{ matrix.target }}/release/geop.exe" ;;
            *) binary="target/${{ matrix.target }}/release/geop" ;;
          esac
          scripts/package-desktop.sh "$version" "${{ matrix.target }}" "$binary" dist

      - name: Start it (Linux)
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/geop-desktop-linux-x64.deb
          home="$(mktemp -d)"
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c "
            HOME='$home' WEBKIT_DISABLE_DMABUF_RENDERER=1 geop-desktop &
            pid=\$!
            sleep 45
            import -window root shots/${{ matrix.target }}.png
            kill -0 \$pid
            kill \$pid
          "
          test -d "$home/Documents/Geop"

      - name: Start it (macOS)
        if: contains(matrix.target, 'darwin')
        shell: bash
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          mkdir -p shots
          mount="$(hdiutil attach -nobrowse dist/geop-desktop-macos-*.dmg | tail -1 | awk -F'\t' '{print $NF}')"
          test -f "$mount/Geop.app/Contents/Resources/geop.icns"
          HOME="$home" "$mount/Geop.app/Contents/MacOS/Geop" &
          pid=$!
          sleep 45
          screencapture -x "shots/${{ matrix.target }}.png" || echo "no screenshot here"
          kill -0 "$pid"
          kill "$pid"
          test -d "$home/Documents/Geop"
          hdiutil detach "$mount" || true

      - name: Start it (Windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $home2 = Join-Path $env:RUNNER_TEMP "home"
          New-Item -ItemType Directory -Force -Path $home2, shots | Out-Null
          $env:USERPROFILE = $home2
          $app = Start-Process -FilePath "dist\geop-desktop-windows-x64.exe" -PassThru
          Start-Sleep -Seconds 45
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $shot.Save("shots\${{ matrix.target }}.png")
          if ($app.HasExited) { throw "the app ended by itself, with $($app.ExitCode)" }
          Stop-Process -Id $app.Id
          if (-not (Test-Path (Join-Path $home2 "Documents\Geop"))) { throw "it made no folder" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-shot-${{ matrix.target }}
          path: shots/*
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  cli:
    name: geop (${{ matrix.target }})
    needs: [pages]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    steps:
      - uses: actions/checkout@v4

      # Embedded by the feature `frontend` (see cad/geop-cad-cli/src/open.rs);
      - uses: actions/download-artifact@v4
        with:
          name: page-open
          path: web/dist-open

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The Linux builds run in cross's containers: they bring the aarch64
      # linker, and link against an old glibc, so the binary runs on every
      # distribution still in use — built on the runner itself it needed the
      # runner's glibc 2.39 and failed on Ubuntu 22.04. Every other target
      # builds on a runner of its own kind.
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      # `geop app` (feature `app`) shows the page in the system's webview:
      # WKWebView and WebView2 come with macOS and Windows, so their
      # builds have it. On Linux it links WebKitGTK 4.1, which cross's
      # images do not have, and which is no older than Ubuntu 22.04
      # (glibc 2.35, past the 2.31 the binary must run on); a binary with
      # it would not even start `geop compile` without the library. Linux
      # users build it from source (README).
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked -p geop-cad-cli --features frontend --target ${{ matrix.target }}
          else
            cargo build --release --locked -p geop-cad-cli --features frontend,app --target ${{ matrix.target }}
          fi

      # A Linux binary must not need a newer glibc than the oldest
      # distribution we support has (Ubuntu 20.04, Debian 11: 2.31).
      - name: Check the glibc it needs
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          newest="$(readelf --dyn-syms -W "target/${{ matrix.target }}/release/geop" 2>/dev/null \
            | grep -o 'GLIBC_2\.[0-9]*' | sort -t. -k2 -n -u | tail -1)"
          echo "needs ${newest:-no versioned glibc}"
          if [ -n "$newest" ] && [ "${newest#GLIBC_2.}" -gt 31 ]; then
            echo "geop needs ${newest}, newer than 2.31" >&2
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="geop-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          case "${{ matrix.target }}" in
            *windows*)
              cp "target/${{ matrix.target }}/release/geop.exe" "dist/${name}/"
              (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null)
              ;;
            *)
              cp "target/${{ matrix.target }}/release/geop" "dist/${name}/"
              tar -C dist -czf "dist/${name}.tar.gz" "${name}"
              ;;
          esac
          rm -r "dist/${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # One extension per platform, `vsce package --target`, each with that
  # platform's `geop` in its `bin/`: the extension then needs nothing else
  # installed, and its page and kernel are of one release. `geop vscode`
  # picks the one of its own platform.
  vscode:
    name: VS Code extension
    needs: [pages, cli]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: page-vscode
          path: vscode-extension/media

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: cli
          merge-multiple: true

      - name: Package
        working-directory: vscode-extension
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm ci
          npm version "$version" --no-git-tag-version --allow-same-version
          mkdir -p ../dist
          for pair in \
            x86_64-unknown-linux-gnu:linux-x64 \
            aarch64-unknown-linux-gnu:linux-arm64 \
            x86_64-apple-darwin:darwin-x64 \
            aarch64-apple-darwin:darwin-arm64 \
            x86_64-pc-windows-msvc:win32-x64; do
            target="${pair%%:*}"
            vscode="${pair##*:}"
            name="geop-${version}-${target}"
            rm -rf bin unpacked && mkdir -p bin unpacked
            case "$target" in
              *windows*)
                unzip -q "../cli/${name}.zip" -d unpacked
                cp "unpacked/${name}/geop.exe" bin/
                ;;
              *)
                tar -xzf "../cli/${name}.tar.gz" -C unpacked
                cp "unpacked/${name}/geop" bin/
                chmod 755 bin/geop
                ;;
            esac
            rm -rf unpacked
            npx vsce package --target "$vscode" --out "../dist/geop-vscode-${version}-${vscode}.vsix"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: dist/*.vsix
          if-no-files-found: error

  web:
    name: Web app (static build)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          (cd web/dist && zip -qr "../../dist/geop-web-${version}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [cli, vscode, web, desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # What is released: not the pages, which are inside the CLI and the
      # extensions.
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-package-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: vscode
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: artifacts

      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
