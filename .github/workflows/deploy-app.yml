name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "cloudflare-functions/**"
      - "cad/**"
      - "core/**"
      - "ops/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

concurrency:
  group: pages-app
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install JS dependencies
        working-directory: web
        run: npm ci

      - name: Build (wasm + vite)
        working-directory: web
        run: npm run build
        env:
          # PostHog project API key (a public, client-side key — a repository
          # *variable*, not a secret). Unset means the build has no usage
          # statistics at all; see web/src/analytics.ts.
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          # The Turnstile widget's site key (public, like the PostHog key):
          # the hosted assistant's bot check (see docs/agent-chat.md). Its
          # secret is the Pages secret TURNSTILE_SECRET.
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAFlnEJQiD_GIxiZ-

      # Nothing ships that a new visitor would see broken: a first visit
      # from a fresh browser profile, in the runner's headless Chrome
      # (web/e2e/firstrun.mjs). It renders the welcome's previews of the
      # examples into dist/examples/ on the way, from this build.
      - name: A first visit, from a fresh profile
        working-directory: web
        run: timeout 900 npm run e2e:first-run

      # The Pages Functions bundle @anthropic-ai/sdk (the hosted assistant,
      # docs/agent-chat.md), so they need their own dependencies.
      - name: Install and check the Pages Functions
        working-directory: cloudflare-functions
        run: |
          if grep -n '= "fill-in-' wrangler.toml; then
            echo "::error::cloudflare-functions/wrangler.toml still has placeholders: fill in the bug report's R2 bucket and KV namespace (docs/agent-chat.md)"
            exit 1
          fi
          npm ci
          npm run typecheck

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: 9f1c6a47335dac47c8e580e269b0ae8d
          command: pages project create geop-cad-app --production-branch main

      # The agent chat's budget: the Durable Object the Pages project binds
      # (cloudflare-functions/wrangler.toml, script_name), so it deploys
      # first. Its vars are the money caps (budget-worker/wrangler.toml).
      - name: Deploy the agent chat's budget worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: 9f1c6a47335dac47c8e580e269b0ae8d
          wranglerVersion: "4.152.0"
          workingDirectory: cloudflare-functions/budget-worker
          command: deploy

      # Run from cloudflare-functions/ so Wrangler finds its functions/
      # (Pages Functions are discovered relative to the working directory,
      # not the output dir) and its wrangler.toml, which holds every binding
      # and var of the project (the secrets stay set on the project).
      - name: Deploy to app.geop-cad.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: 9f1c6a47335dac47c8e580e269b0ae8d
          workingDirectory: cloudflare-functions
          command: pages deploy ../web/dist --project-name=geop-cad-app --branch=main --commit-dirty=true
