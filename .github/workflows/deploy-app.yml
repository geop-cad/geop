name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "cad/**"
      - "core/**"
      - "ops/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

concurrency:
  group: pages-app
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install JS dependencies
        working-directory: web
        run: npm ci

      - name: Build (wasm + vite)
        working-directory: web
        run: npm run build
        env:
          # PostHog project API key (a public, client-side key — a repository
          # *variable*, not a secret). Unset means the build has no usage
          # statistics at all; see web/src/analytics.ts.
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: 9f1c6a47335dac47c8e580e269b0ae8d
          command: pages project create geop-cad-app --production-branch main

      # Run from web/ so Wrangler finds web/functions/ (Pages Functions are
      # discovered relative to the working directory, not the output dir)
      # and picks up its R2 binding — see functions/api/bug-report.ts.
      - name: Deploy to app.geop-cad.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: 9f1c6a47335dac47c8e580e269b0ae8d
          workingDirectory: web
          command: pages deploy dist --project-name=geop-cad-app --branch=main --commit-dirty=true
