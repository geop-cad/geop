name: Deploy Rust book

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - ".github/workflows/deploy-book.yml"
  workflow_dispatch:

concurrency:
  group: pages-book
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: Build book
        run: mdbook build book

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: 9f1c6a47335dac47c8e580e269b0ae8d
          command: pages project create geop-cad-book --production-branch main

      - name: Deploy to book.geop-cad.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: 9f1c6a47335dac47c8e580e269b0ae8d
          command: pages deploy book/dist --project-name=geop-cad-book --branch=main --commit-dirty=true
