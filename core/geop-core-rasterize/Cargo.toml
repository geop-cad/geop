[package]
name = "geop-core-rasterize"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
geop-core-math.workspace = true
geop-core-geometry.workspace = true
geop-core-topology.workspace = true

[dev-dependencies]
# Its tests rasterize the topology crate's unit cube; those of curved and
# swept solids are with the shapes, in `geop-lib-sweep`.
geop-core-topology = { workspace = true, features = ["testing"] }
