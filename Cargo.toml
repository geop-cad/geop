[workspace]
resolver = "2"
members = [
    "core/geop-core-program",
    "core/geop-core-editor",
    "core/geop-core-math",
    "core/geop-core-geometry",
    "core/geop-core-topology",
    "core/geop-core-sketch",
    "core/geop-core-rasterize",
    "lib/geop-lib-sheet",
    "lib/geop-lib-stdlib",
    "ops/geop-ops-model",
    "ops/geop-ops-parameters",
    "ops/geop-ops-sketch",
    "ops/geop-ops-datums",
    "ops/geop-ops-reference-geometry",
    "ops/geop-ops-extrude-revolve",
    "ops/geop-ops-boolean",
    "ops/geop-ops-edit",
    "ops/geop-ops-fillet",
    "ops/geop-ops-shell",
    "ops/geop-ops-assembly",
    "cad/geop-cad-base",
    "cad/geop-cad-web",
    "cad/geop-cad-cli",
    "ops/geop-ops-drawing",
    "ops/geop-ops-inspect",
    "ops/geop-ops-subd",
    "ops/geop-ops-sheetmetal",
    "ops/geop-ops-plastic",
    "ops/geop-ops-sketch3d",
    "ops/geop-ops-step",
    "ops/geop-ops-surface",
    "ops/geop-ops-pattern",
    "ops/geop-ops-harness",
    "ops/geop-ops-hole",
    "ops/geop-ops-urdf",
    "ops/geop-ops-bom",
    "lib/geop-lib-constraints",
    "lib/geop-lib-booleans",
    "lib/geop-lib-sweep",
    "lib/geop-lib-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
geop-core-program = { path = "core/geop-core-program" }
geop-core-editor = { path = "core/geop-core-editor" }
geop-core-math = { path = "core/geop-core-math" }
geop-core-geometry = { path = "core/geop-core-geometry" }
geop-core-topology = { path = "core/geop-core-topology" }
geop-core-sketch = { path = "core/geop-core-sketch" }
geop-core-rasterize = { path = "core/geop-core-rasterize" }
geop-lib-sheet = { path = "lib/geop-lib-sheet" }
geop-lib-stdlib = { path = "lib/geop-lib-stdlib" }
geop-ops-model = { path = "ops/geop-ops-model" }
geop-ops-parameters = { path = "ops/geop-ops-parameters" }
geop-ops-sketch = { path = "ops/geop-ops-sketch" }
geop-ops-datums = { path = "ops/geop-ops-datums" }
geop-ops-reference-geometry = { path = "ops/geop-ops-reference-geometry" }
geop-ops-extrude-revolve = { path = "ops/geop-ops-extrude-revolve" }
geop-ops-boolean = { path = "ops/geop-ops-boolean" }
geop-ops-edit = { path = "ops/geop-ops-edit" }
geop-ops-fillet = { path = "ops/geop-ops-fillet" }
geop-ops-shell = { path = "ops/geop-ops-shell" }
geop-ops-drawing = { path = "ops/geop-ops-drawing" }
geop-ops-assembly = { path = "ops/geop-ops-assembly" }
geop-ops-inspect = { path = "ops/geop-ops-inspect" }
geop-ops-subd = { path = "ops/geop-ops-subd" }
serde = { version = "1", features = ["derive"] }
geop-ops-sheetmetal = { path = "ops/geop-ops-sheetmetal" }
geop-ops-plastic = { path = "ops/geop-ops-plastic" }
geop-ops-step = { path = "ops/geop-ops-step" }
geop-ops-sketch3d = { path = "ops/geop-ops-sketch3d" }
geop-ops-surface = { path = "ops/geop-ops-surface" }
# `float_roundtrip`: without it, parsing a float may land one ULP off the
# value that was written, and a program read back from JSON would no longer
# build the very same part.
serde_json = { version = "1", features = ["float_roundtrip"] }
geop-cad-base = { path = "cad/geop-cad-base" }
rayon = "1"
indexmap = "2"
# Maps that share structure with their copies, so that a version of a model
# made by editing another copies only what the edit touched.
imbl = "7"
geop-ops-pattern = { path = "ops/geop-ops-pattern" }
geop-ops-harness = { path = "ops/geop-ops-harness" }
geop-ops-hole = { path = "ops/geop-ops-hole" }
geop-ops-urdf = { path = "ops/geop-ops-urdf" }
geop-ops-bom = { path = "ops/geop-ops-bom" }
geop-lib-constraints = { path = "lib/geop-lib-constraints" }
geop-lib-booleans = { path = "lib/geop-lib-booleans" }
geop-lib-sweep = { path = "lib/geop-lib-sweep" }
geop-lib-shell = { path = "lib/geop-lib-shell" }

# `cargo test` otherwise builds these crates unoptimized, which is fine for
# cheap unit tests but disastrous for the render-test suites in
# geop-lib-booleans: they run a full remesh/boolean/rasterize per scene,
# ~175 scenes per test, and that numeric geometry code is 10-20x slower
# without optimizations. Only `cargo test` picks this up — `cargo build`/
# `cargo run` still use the unoptimized `dev` profile, so the normal
# edit-compile-debug loop is untouched.
[profile.test]
opt-level = 3
