[workspace]
resolver = "2"
members = [
    "core/geop-core-math",
    "core/geop-core-geometry",
    "core/geop-core-topology",
    "core/geop-core-sketch",
    "core/geop-core-solve",
    "ops/geop-ops",
    "ops/geop-ops-derive",
    "ops/geop-ops-sketch",
    "ops/geop-ops-datums",
    "ops/geop-ops-extrude-revolve",
    "ops/geop-ops-booleans",
    "ops/geop-ops-edit",
    "ops/geop-ops-fillet",
    "ops/geop-ops-shell",
    "ops/geop-ops-assembly",
    "ops/geop-ops-rasterize",
    "cad/geop-cad-base",
    "cad/geop-cad-web",
    "cad/geop-cad-cli",
    "ops/geop-ops-subd",
    "ops/geop-ops-sheetmetal",
    "ops/geop-ops-plastic",
    "ops/geop-ops-sketch3d",
    "ops/geop-ops-surface",
    "ops/geop-ops-pattern",
    "ops/geop-ops-harness",
    "ops/geop-ops-hole",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
geop-core-math = { path = "core/geop-core-math" }
geop-core-geometry = { path = "core/geop-core-geometry" }
geop-core-topology = { path = "core/geop-core-topology" }
geop-core-sketch = { path = "core/geop-core-sketch" }
geop-core-solve = { path = "core/geop-core-solve" }
geop-ops = { path = "ops/geop-ops" }
geop-ops-derive = { path = "ops/geop-ops-derive" }
geop-ops-sketch = { path = "ops/geop-ops-sketch" }
geop-ops-datums = { path = "ops/geop-ops-datums" }
geop-ops-extrude-revolve = { path = "ops/geop-ops-extrude-revolve" }
geop-ops-booleans = { path = "ops/geop-ops-booleans" }
geop-ops-edit = { path = "ops/geop-ops-edit" }
geop-ops-fillet = { path = "ops/geop-ops-fillet" }
geop-ops-shell = { path = "ops/geop-ops-shell" }
geop-ops-assembly = { path = "ops/geop-ops-assembly" }
geop-ops-rasterize = { path = "ops/geop-ops-rasterize" }
geop-ops-subd = { path = "ops/geop-ops-subd" }
serde = { version = "1", features = ["derive"] }
geop-ops-sheetmetal = { path = "ops/geop-ops-sheetmetal" }
# `float_roundtrip`: without it, parsing a float may land one ULP off the
geop-ops-plastic = { path = "ops/geop-ops-plastic" }
# value that was written, and a program read back from JSON would no longer
geop-ops-sketch3d = { path = "ops/geop-ops-sketch3d" }
# build the very same part.
geop-ops-surface = { path = "ops/geop-ops-surface" }
serde_json = { version = "1", features = ["float_roundtrip"] }
geop-cad-base = { path = "cad/geop-cad-base" }
rayon = "1"
geop-ops-pattern = { path = "ops/geop-ops-pattern" }
geop-ops-harness = { path = "ops/geop-ops-harness" }
geop-ops-hole = { path = "ops/geop-ops-hole" }

# `cargo test` otherwise builds these crates unoptimized, which is fine for
# cheap unit tests but disastrous for the render-test suites in
# geop-ops-booleans: they run a full remesh/boolean/rasterize per scene,
# ~175 scenes per test, and that numeric geometry code is 10-20x slower
# without optimizations. Only `cargo test` picks this up — `cargo build`/
# `cargo run` still use the unoptimized `dev` profile, so the normal
# edit-compile-debug loop is untouched.
[profile.test]
opt-level = 3
