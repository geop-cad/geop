[package]
# Kept as `geop` (not `geop-cad-web`) so the wasm-pack output filenames
# (`geop.js` / `geop_bg.wasm`) match what `web/src/geop.ts` already imports
# — the crate's directory name follows the workspace layout, its package
# name is a separate, deliberately-stable choice.
name = "geop"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
geop-core-math.workspace = true
geop-cad-base.workspace = true
geop-ops.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
