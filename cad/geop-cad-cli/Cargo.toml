[package]
name = "geop-cad-cli"
version.workspace = true
edition.workspace = true

# `geop compile part.geop` — named for the project, not the crate.
[[bin]]
name = "geop"
path = "src/main.rs"

[dependencies]
geop-core-math.workspace = true
geop-ops.workspace = true
geop-cad-base.workspace = true
geop-ops-rasterize.workspace = true
geop-ops-step.workspace = true
geop-ops-drawing.workspace = true
geop-ops-urdf.workspace = true
geop-ops-bom.workspace = true
geop-ops-sheetmetal.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
