[package]
name = "geop-cad-base"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
geop-core-program.workspace = true
geop-core-editor.workspace = true
geop-core-math.workspace = true
# The standard parts every workspace can place, beside its files.
geop-lib-stdlib.workspace = true
# Every operation crate, registered in `registry.rs`, one line each.
geop-ops-model.workspace = true
geop-ops-sketch.workspace = true
geop-ops-reference-geometry = { workspace = true, features = ["examples"] }
geop-ops-sketch3d.workspace = true
geop-ops-extrude-revolve = { workspace = true, features = ["examples"] }
geop-ops-hole = { workspace = true, features = ["examples"] }
geop-ops-fillet = { workspace = true, features = ["examples"] }
geop-ops-shell.workspace = true
geop-ops-plastic.workspace = true
geop-ops-boolean = { workspace = true, features = ["examples"] }
geop-ops-pattern = { workspace = true, features = ["examples"] }
geop-ops-subd.workspace = true
geop-ops-surface = { workspace = true, features = ["examples"] }
geop-ops-edit.workspace = true
geop-ops-assembly = { workspace = true, features = ["examples"] }
geop-ops-harness.workspace = true
geop-ops-step.workspace = true
geop-ops-drawing.workspace = true
geop-ops-sheetmetal = { workspace = true, features = ["examples"] }
geop-ops-inspect.workspace = true
geop-ops-bom.workspace = true

[dev-dependencies]
# The composition's tests (`tests.rs`): every example drawn, weighed and
# halved, edited incrementally, and the editor driven over all of it.
geop-core-editor = { workspace = true, features = ["testing"] }
geop-core-program = { workspace = true, features = ["testing"] }
geop-core-geometry.workspace = true
geop-lib-booleans.workspace = true
geop-lib-sheet.workspace = true
geop-lib-sweep = { workspace = true, features = ["testing"] }
geop-ops-extrude-revolve = { workspace = true, features = ["testing", "examples"] }
serde_json.workspace = true
