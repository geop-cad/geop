[package]
name = "geop-ops-step"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
geop-core-program.workspace = true
geop-core-editor.workspace = true
geop-core-math.workspace = true
geop-core-geometry.workspace = true
geop-core-topology.workspace = true
geop-ops-model.workspace = true
serde.workspace = true

[dev-dependencies]
# The parts written and read back: given solids, and the example parts —
# extruded, revolved, drilled, booleaned — whose surfaces no given solid
# has (a cone, a cross-drilled shaft).
geop-lib-fixtures.workspace = true
geop-ops-extrude-revolve = { workspace = true, features = ["examples", "testing"] }
geop-ops-model = { workspace = true, features = ["testing"] }
geop-lib-sweep = { workspace = true, features = ["testing"] }
# STEP exported and imported in an editor, of parts and of the example
# assemblies, the standard parts beside them: the operations those are
# written in — sketched on datums, extruded, patterned, placed.
geop-core-editor = { workspace = true, features = ["testing"] }
geop-ops-sketch.workspace = true
geop-ops-reference-geometry.workspace = true
geop-ops-pattern.workspace = true
geop-lib-stdlib.workspace = true
serde_json.workspace = true
geop-ops-assembly = { workspace = true, features = ["examples"] }
# Rounded and hollowed parts written and read back (`regression_tests.rs`):
# the surfaces and fitted edges a blend and a shell leave.
geop-ops-fillet.workspace = true
geop-ops-shell.workspace = true
