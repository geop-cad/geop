[package]
name = "geop-ops-model"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
geop-core-math.workspace = true
geop-core-geometry.workspace = true
geop-core-topology.workspace = true
geop-core-sketch.workspace = true
geop-core-program.workspace = true
geop-core-editor.workspace = true
geop-core-rasterize.workspace = true
serde.workspace = true
serde_json.workspace = true
# The name registry shares its structure with its copies, as the topology does.
imbl.workspace = true

[features]
# What the tests of the operations share about the model (see `testing`).
testing = ["geop-core-topology/testing"]

[dev-dependencies]
geop-core-topology = { workspace = true, features = ["testing"] }
