[package]
name = "geop-ops-extrude-revolve"
version.workspace = true
edition.workspace = true

[dependencies]
geop-core-program.workspace = true
geop-core-editor.workspace = true
geop-core-math.workspace = true
geop-core-geometry.workspace = true
geop-core-topology.workspace = true
geop-core-sketch.workspace = true
geop-ops-model.workspace = true
geop-ops-datums.workspace = true
geop-ops-parameters.workspace = true
geop-ops-sketch.workspace = true
geop-ops-sketch3d.workspace = true
geop-ops-booleans.workspace = true
serde.workspace = true
# Only for `testing`: reading and writing the arguments of steps.
serde_json = { workspace = true, optional = true }

[features]
# For other crates' tests: the basic solids of `shapes`, and the sketches,
# extrusions and programs of `testing` that their programs are written with.
testing = ["dep:serde_json", "geop-ops-model/testing"]

[dev-dependencies]
geop-ops-model = { workspace = true, features = ["testing"] }
geop-ops-rasterize.workspace = true
geop-ops-add-datum.workspace = true
serde_json.workspace = true
