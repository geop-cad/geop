[package]
name = "geop-ops-extrude-revolve"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
geop-core-program.workspace = true
geop-core-editor.workspace = true
geop-core-math.workspace = true
geop-core-geometry.workspace = true
geop-core-topology.workspace = true
geop-core-sketch.workspace = true
geop-ops-model.workspace = true
geop-lib-booleans.workspace = true
geop-lib-sweep.workspace = true
serde.workspace = true
# Only for `testing`: reading and writing the arguments of steps.
serde_json = { workspace = true, optional = true }
geop-ops-sketch = { workspace = true, optional = true }
geop-ops-sketch3d = { workspace = true, optional = true }

[features]
# For other crates' tests: the sketches, extrusions and programs of
# `testing` that their programs are written with.
testing = ["dep:serde_json", "dep:geop-ops-sketch", "geop-ops-model/testing"]
# The examples: programs of sketches, 3-D sketches and sweeps. Written in
# the sketch operations too, so only an editor turns it on.
examples = ["dep:geop-ops-sketch", "dep:geop-ops-sketch3d"]

[dev-dependencies]
# The examples' round trips and incremental builds.
geop-core-program = { workspace = true, features = ["testing"] }
# Its operations and the parameters panel edited as a front end edits them.
geop-core-editor = { workspace = true, features = ["testing"] }
geop-ops-model = { workspace = true, features = ["testing"] }
# The datums its programs sketch on and sweep up to, given.
geop-lib-fixtures.workspace = true
serde_json.workspace = true
geop-ops-sketch.workspace = true
geop-ops-sketch3d.workspace = true
# The shelled cup a regression test turns a handle up to.
geop-ops-shell.workspace = true
