[package]
name = "geop-ops-fillet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
geop-core-program.workspace = true
geop-core-editor.workspace = true
geop-core-math.workspace = true
geop-core-geometry.workspace = true
geop-core-topology.workspace = true
geop-ops-model.workspace = true
geop-lib-sweep.workspace = true
geop-lib-booleans.workspace = true
serde.workspace = true
# Only for `examples`.
geop-ops-extrude-revolve = { workspace = true, optional = true }
geop-ops-sketch = { workspace = true, optional = true }

[features]
# The examples: solids extruded from sketches, then rounded. Written in
# those operations too, so only an editor turns it on.
examples = ["dep:geop-ops-extrude-revolve", "dep:geop-ops-sketch"]

[dev-dependencies]
# The examples' round trips and incremental builds.
geop-core-program = { workspace = true, features = ["testing"] }
geop-ops-model = { workspace = true, features = ["testing"] }
# The given solids and datums the tests blend, and the stress sweeps' bodies.
geop-lib-fixtures.workspace = true
# The regression test of rounding a shelled box.
geop-ops-shell.workspace = true
# The examples, and the bodies no primitive makes: a slot, and lofts.
geop-ops-extrude-revolve = { workspace = true, features = ["testing"] }
geop-ops-sketch.workspace = true
geop-lib-sweep = { workspace = true, features = ["testing"] }
serde_json.workspace = true
geop-core-editor = { workspace = true, features = ["testing"] }
