[package]
name = "geop-ops-pattern"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
geop-core-program.workspace = true
geop-core-editor.workspace = true
geop-core-math.workspace = true
geop-core-geometry.workspace = true
geop-core-topology.workspace = true
geop-ops-model.workspace = true
geop-lib-booleans.workspace = true
serde.workspace = true
# Only for `examples`.
geop-ops-extrude-revolve = { workspace = true, optional = true }
geop-ops-sketch = { workspace = true, optional = true }

[features]
# The examples: plates and holes extruded from sketches, patterned.
# Written in those operations too, so only an editor turns it on.
examples = ["dep:geop-ops-extrude-revolve", "dep:geop-ops-sketch"]

[dev-dependencies]
geop-core-program = { workspace = true, features = ["testing"] }
geop-ops-model = { workspace = true, features = ["testing"] }
geop-core-editor = { workspace = true, features = ["testing"] }
# The given plates, pins and boxes the tests pattern, and the blocks of
# the direct tests.
geop-lib-fixtures.workspace = true
geop-lib-sweep = { workspace = true, features = ["testing"] }
# Turned copies joined one after the other.
geop-ops-boolean.workspace = true
# The examples are written in sketches and extrusions; a pattern runs
# along a sketch's line, and along a 3-D sketch's.
geop-ops-extrude-revolve = { workspace = true, features = ["testing"] }
geop-ops-sketch.workspace = true
geop-ops-sketch3d.workspace = true
# The turbine example's blade is lofted between datum planes.
geop-ops-reference-geometry.workspace = true
serde_json.workspace = true
