[package]
name = "geop-ops-drawing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
geop-core-program.workspace = true
geop-core-editor.workspace = true
geop-core-math.workspace = true
geop-core-geometry.workspace = true
geop-core-topology.workspace = true
# How a dimension is drawn: shared with the sketch editor.
geop-core-sketch.workspace = true
geop-ops-model.workspace = true
geop-lib-sheet.workspace = true
# The plane a section cuts on.
geop-lib-booleans.workspace = true
geop-lib-sweep.workspace = true
serde.workspace = true

[dev-dependencies]
# Parts placed and drawn: given models on a shelf, and the example
# assemblies (the bolted plate, the press).
geop-ops-assembly = { workspace = true, features = ["testing", "examples"] }
geop-ops-model = { workspace = true, features = ["testing"] }
geop-core-program = { workspace = true, features = ["testing"] }
geop-lib-sweep = { workspace = true, features = ["testing"] }
serde_json.workspace = true
# The given solids and datums the drawn plates are built from and cut on.
geop-lib-fixtures.workspace = true
# The example parts whose geometry is drawn — a tapped hole's thread, a
# subdivision surface's silhouette, a revolved flange's waist, a cone's
# generators — and the operations those, the example assemblies' parts and
# the standard parts are written in: sketched on datums, extruded,
# revolved, drilled, rounded, subdivided, patterned and mirrored.
geop-ops-extrude-revolve.workspace = true
geop-ops-hole = { workspace = true, features = ["examples"] }
geop-ops-subd.workspace = true
geop-ops-fillet.workspace = true
geop-ops-pattern = { workspace = true, features = ["examples"] }
geop-ops-reference-geometry = { workspace = true, features = ["examples"] }
geop-lib-stdlib.workspace = true
geop-core-editor = { workspace = true, features = ["testing"] }
geop-ops-sketch.workspace = true
