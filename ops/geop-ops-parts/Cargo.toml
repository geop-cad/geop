[package]
name = "geop-ops-parts"
version.workspace = true
edition.workspace = true

[dependencies]
geop-core-math.workspace = true
geop-core-geometry.workspace = true
geop-core-topology.workspace = true
geop-core-sketch.workspace = true
geop-core-part.workspace = true
geop-ops-extrude-revolve.workspace = true
geop-ops-booleans.workspace = true
serde = { version = "1", features = ["derive"] }
geop-ops-parts-derive.workspace = true
# `float_roundtrip`: without it, parsing a float may land one ULP off the
# value that was written, and a program read back from JSON would no longer
# build the very same part.
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
geop-ops-rasterize.workspace = true
