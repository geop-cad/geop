<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geop</title>
  </head>
  <body>
    <div id="root">
      <style>
        #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #1e1e1e; }
        #boot span { width: 2rem; height: 2rem; border: 3px solid #3a3a3a; border-top-color: #9aa0a6; border-radius: 50%; animation: boot-spin 0.8s linear infinite; }
        @keyframes boot-spin { to { transform: rotate(360deg); } }
      </style>
      <div id="boot" role="status" aria-label="Loading"><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
